    <style>
        * {

            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #8b5cf6 transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {

        body {

            overflow: hidden;

            transition: background-color 0.3s ease, color 0.3s ease;

        body.light {

            --bg-secondary: #ffffff;
            --bg-card: #ffffff;

            --shadow: 0 10px 30px -5px rgba(139, 92, 246, 0.1), 0 0 1px 1px rgba(139, 92, 246, 0.08);
            --shadow-hover: 0 20px 40px -10px rgba(139, 92, 246, 0.25), 0 0 1px 1px rgba(139, 92, 246, 0.2);
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-glow: rgba(139, 92, 246, 0.12);
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --gradient-start: #7c3aed;
            --gradient-end: #a855f7;
        }

        body.dark {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #181825;
            --border-color: #2d2d44;
            --text-primary: #f8fafc;
            --text-secondary: #a5b4fc;
            --text-muted: #818cf8;
            --glass-bg: rgba(18, 18, 26, 0.9);
            --glass-border: rgba(45, 45, 68, 0.8);
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(139, 92, 246, 0.05);
            --shadow-hover: 0 20px 40px -10px rgba(139, 92, 246, 0.25), 0 0 1px 1px rgba(139, 92, 246, 0.25);
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.2);
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --gradient-start: #8b5cf6;
            --gradient-end: #a855f7;

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .vscode-window,
        .vscode-window *,
        pre[class*="language-"],
        pre[class*="language-"] *,

            background-color: #1e1e1e !important;
            color: #d4d4d4 !important;
            border-color: #333 !important;
        }
        .vscode-window .vscode-header {
            background: #252526 !important;
        }
        .vscode-window .code-tabs {
            background: #2d2d2d !important;
        }
        .vscode-window .code-tab {
            background: #2d2d2d !important;
            color: #969696 !important;

        .vscode-window .code-tab.active {

            color: #ffffff !important;

            border-color: rgba(255, 255, 255, 0.2) !important;

            background: var(--accent) !important;
            color: #000 !important;

        .sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            top: 0;
            z-index: 40;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow-y: auto;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html[dir="rtl"] .sidebar {
            right: 0;
            border-left: 1px solid var(--glass-border);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15);
        }
        html[dir="ltr"] .sidebar {
            left: 0;
            border-right: 1px solid var(--glass-border);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.15);
        }

        .main-area {
            height: 100vh;
            overflow-y: auto;
            transition: margin 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-primary);
        }

        html[dir="rtl"] .main-area {
            margin-right: 280px;
            margin-left: 0;
        }
        html[dir="ltr"] .main-area {
            margin-left: 280px;

            backdrop-filter: blur(20px);

            border-bottom: 1px solid var(--glass-border);
        }

            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }
        .card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 18px 20px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            color: var(--text-muted);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        html[dir="rtl"] .nav-item {
            border-right: 3px solid transparent;
            border-radius: 0 12px 12px 0;
            margin: 3px 10px 3px 0;
            padding-left: 18px;
            padding-right: 24px;
        }
        html[dir="ltr"] .nav-item {
            border-left: 3px solid transparent;
            border-radius: 12px 0 0 12px;
            margin: 3px 0 3px 10px;
            padding-right: 18px;
            padding-left: 24px;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: var(--accent-glow);
        }
        .nav-item.active {
            color: var(--accent);
            background: var(--accent-glow);
            font-weight: 600;
        }
        html[dir="rtl"] .nav-item.active {
            border-right-color: var(--accent);
        }
        html[dir="ltr"] .nav-item.active {
            border-left-color: var(--accent);
        }
        .nav-item i {
            width: 22px;
            text-align: center;
            font-size: 15px;
            opacity: 0.75;
        }
        .nav-item.active i {
            opacity: 1;
        }

        .vscode-window {
            background: #1e1e1e !important;
            border-radius: 14px;
            border: 1px solid #333333;
            overflow: hidden;
            margin: 12px 0;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
            direction: ltr !important;
            text-align: left !important;
        }

        .vscode-header {
            background: #252526;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333333;
        }
        .vscode-dots {
            display: flex;
            gap: 6px;
        }
        .vscode-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red {
            background: #ff5f56;
        }
        .dot-yellow {
            background: #ffbd2e;
        }
        .dot-green {
            background: #27c93f;
        }

        .code-tabs {
            display: flex;
            background: #2d2d2d;
            border-bottom: 1px solid #333333;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .code-tab {
            padding: 8px 18px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            color: #969696;
            border-right: 1px solid #333333;
            transition: all 0.2s;
            background: #2d2d2d;
            white-space: nowrap;
        }
        .code-tab.active {
            color: #ffffff;
            background: #1e1e1e;
            border-top: 2px solid var(--accent);
        }
        .code-tab:hover:not(.active) {
            color: #cccccc;
            background: #353535;
        }
        .code-panel {
            display: none;
        }
        .code-panel.active {
            display: block;
        }

        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            transition: all 0.2s;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .copy-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        pre[class*="language-"] {
            margin: 0 !important;
            padding: 20px !important;
            background: #1e1e1e !important;
            font-size: 13px !important;
            line-height: 1.7 !important;
            max-height: 480px;
            text-align: left !important;
            direction: ltr !important;
        }

            font-family: 'JetBrains Mono', monospace !important;
            text-align: left !important;
            direction: ltr !important;
            color: #d4d4d4 !important;
        }

        .response-pre {
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            font-size: 13px;
            line-height: 1.7;
            max-height: 480px;
            overflow: auto;
            color: #d4d4d4;
            font-family: 'JetBrains Mono', monospace;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .method-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            direction: ltr;
        }
        .method-post {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .method-get {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .endpoint {
            background: var(--bg-card);
            padding: 16px 22px;
            border-radius: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            border: 1px solid var(--border-color);
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: all 0.2s;
            direction: ltr !important;
            text-align: left !important;
        }
        .endpoint:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .endpoint .path {
            font-weight: 600;
            color: var(--text-primary);
        }

        .table-doc {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .table-doc th {
            padding: 14px 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        html[dir="rtl"] .table-doc th,
        html[dir="rtl"] .table-doc td {
            text-align: right;
        }
        html[dir="ltr"] .table-doc th,
        html[dir="ltr"] .table-doc td {
            text-align: left;
        }
        .table-doc td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            color: var(--text-secondary);
        }

        .alert-box {
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            backdrop-filter: blur(4px);
        }
        .alert-info {
            background: rgba(139, 92, 246, 0.08);
            border-color: rgba(139, 92, 246, 0.25);
            color: #a78bfa;
        }
        .alert-warn {
            background: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.25);
            color: #f59e0b;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.08);
            border-color: rgba(34, 197, 94, 0.25);
            color: #22c55e;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }
        body.light .alert-info {
            background: #ecfeff;
            border-color: #a5f3fc;
            color: #0e7490;
        }
        body.light .alert-warn {
            background: #fffbeb;
            border-color: #fde68a;
            color: #b45309;
        }
        body.light .alert-success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }
        body.light .alert-error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #b91c1c;
        }

        .feature-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }
        .feature-item:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
        }
        .feature-item i {
            font-size: 28px;

            height: 56px;
            border-radius: 16px;
        }
        .feature-item h4 {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .feature-item p {

            color: var(--text-secondary);

        }

        .logo-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--accent-glow);

            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent);

            object-fit: cover;

                '<i class="fa-solid fa-sun"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') {
                isDark = false;
                document.body.classList.remove('dark');
                document.body.classList.add('light');
                document.getElementById('themeBtn').innerHTML = '<i class="fa-solid fa-sun"></i>';

        function vscodeCodeTabs(examples) {
            const labels = { python: 'python.py', curl: 'request.sh', php: 'api.php', go: 'client.go',
                json: 'response.json' };
            const langs = { python: 'python', curl: 'bash', php: 'php', go: 'go', json: 'json' };
            let tabs = '',
                panels = '';
            const keys = Object.keys(examples);
            keys.forEach((k, i) => {
                tabs +=
                    `<div class="code-tab${i === 0 ? ' active' : ''}" onclick="switchCodeTab(this)"><i class="fa-solid fa-file-code text-[11px] mr-1.5 opacity-70"></i>${labels[k] || k}</div>`;
                panels +=
                    `<div class="code-panel${i === 0 ? ' active' : ''}"><div style="position:relative"><button class="copy-btn" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> ${currentLang==='fa'?'کپی':'Copy'}</button><pre class="language-${langs[k] || 'text'}"><code>${esc(examples[k])}</code></pre></div></div>`;
            });
            return `<div class="vscode-window"><div class="vscode-header"><div class="vscode-dots"><div class="vscode-dot dot-red"></div><div class="vscode-dot dot-yellow"></div><div class="vscode-dot dot-green"></div></div><span class="text-[11px] font-mono text-gray-400">${keys[0]||'code'}</span></div><div class="code-tabs">${tabs}</div>${panels}</div>`;
        }

        function switchCodeTab(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
            const panels = parent.parentElement.querySelectorAll('.code-panel');
            const idx = Array.from(parent.querySelectorAll('.code-tab')).indexOf(el);
            panels.forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            if (panels[idx]) panels[idx].classList.add('active');
            try { Prism.highlightAll(); } catch (e) {}
        }

        function copyCode(btn) {
            const code = btn.parentElement.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> ${currentLang==='fa'?'کپی شد':'Copied'}`;
                setTimeout(() => btn.innerHTML =
                    `<i class="fa-regular fa-copy"></i> ${currentLang==='fa'?'کپی':'Copy'}`, 2000);
            });
        }

                                        <tr><td><code class="text-purple-400">Moxra.channel</code></td><td><span class="text-xs text-[--text-muted]">string</span></td><td class="text-sm">${currentLang==='fa'?'کانال رسمی (moxra.ir)':'Official channel'}</td></tr>
                                        <tr><td><code class="text-purple-400">Moxra.writer</code></td><td><span class="text-xs text-[--text-muted]">string</span></td><td class="text-sm">${currentLang==='fa'?'نویسندگان پروژه':'Project writers'}</td></tr>
                                        <tr><td><code class="text-purple-400">Moxra.result</code></td><td><span class="text-xs text-[--text-muted]">object</span></td><td class="text-sm">${currentLang==='fa'?'نتیجه تشخیص':'Detection result'}</td></tr>
                                        <tr><td><code class="text-purple-400">result.predictions</code></td><td><span class="text-xs text-[--text-muted]">object</span></td><td class="text-sm">${currentLang==='fa'?'پیش‌بینی ۵ دسته‌بندی':'5 category predictions'}</td></tr>
                                        <tr><td><code class="text-purple-400">result.nsfw_score</code></td><td><span class="text-xs text-[--text-muted]">float</span></td><td class="text-sm">${currentLang==='fa'?'امتیاز نامناسب بودن (۰ تا ۱)':'NSFW score (0 to 1)'}</td></tr>
                                        <tr><td><code class="text-purple-400">result.is_nsfw</code></td><td><span class="text-xs text-[--text-muted]">boolean</span></td><td class="text-sm">${currentLang==='fa'?'آیا محتوا نامناسب است؟':'Is content NSFW?'}</td></tr>
                                        <tr><td><code class="text-purple-400">result.is_safe</code></td><td><span class="text-xs text-[--text-muted]">boolean</span></td><td class="text-sm">${currentLang==='fa'?'آیا محتوا ایمن است؟ (nsfw_score ≤ 0.3)':'Is content safe?'}</td></tr>
                                        <tr><td><code class="text-purple-400">result.is_suspicious</code></td><td><span class="text-xs text-[--text-muted]">boolean</span></td><td class="text-sm">${currentLang==='fa'?'آیا محتوا مشکوک است؟ (0.3 < nsfw_score ≤ 0.5)':'Is content suspicious?'}</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="card">
                            <h3 class="text-lg font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-lock-open text-purple-400"></i>${currentLang==='fa'?'دسترسی عمومی (بدون احراز هویت)':'Public Access (No Authentication)'}</h3>
                            <div class="alert-box alert-success">
                                <i class="fa-solid fa-check-circle mt-0.5 text-lg flex-shrink-0"></i>
                                <div>
                                    ${currentLang==='fa'?
                                        'تمامی اندپوینت‌های این API به صورت <strong>عمومی و رایگان</strong> در دسترس هستند. برای استفاده از سرویس نیازی به توکن یا احراز هویت نیست.':
                                        'All endpoints of this API are <strong>public and free</strong> to use. No token or authentication is required.'
                                    }
                                </div>
                            </div>
                        </div>
                    </div>`;
            },

            'playground': () => {
                const d = t[currentLang].playground;
                return `
                    <div class="page-content">
                        <h1 class="text-3xl sm:text-4xl font-black mb-2">${d.title}</h1>
                        <p class="text-[--text-secondary] mb-6">${d.subtitle}</p>
                        ${alertBox('info', 'circle-info', d.alert)}

                        <div class="grid lg:grid-cols-4 gap-4 mb-6">
                            <div class="playground-card">
                                <div>
                                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-image text-purple-400"></i>${d.imageCard}</h3>
                                    <div class="file-upload-wrapper">
                                        <input type="file" id="pg_image" accept="image/*" onchange="updateFileName(this, 'img_name')">
                                        <i class="fa-solid fa-cloud-arrow-up file-upload-icon"></i>
                                        <span class="file-upload-text">${d.uploadImage}</span>
                                        <span class="file-upload-hint">JPG, PNG, WEBP, BMP</span>
                                        <div id="img_name" class="file-selected-name"></div>
                                    </div>
                                </div>
                                <button class="btn-primary w-full mt-3" onclick="pgSendImage()"><i class="fa-solid fa-image"></i> ${d.imageBtn}</button>
                            </div>

                            <div class="playground-card">
                                <div>
                                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-file-image text-purple-400"></i>${d.gifCard}</h3>
                                    <div class="file-upload-wrapper">
                                        <input type="file" id="pg_gif" accept=".gif" onchange="updateFileName(this, 'gif_name')">
                                        <i class="fa-solid fa-cloud-arrow-up file-upload-icon"></i>
                                        <span class="file-upload-text">${d.uploadGif}</span>
                                        <span class="file-upload-hint">GIF Animation</span>
                                        <div id="gif_name" class="file-selected-name"></div>
                                    </div>
                                </div>
                                <button class="btn-primary w-full mt-3" onclick="pgSendGif()"><i class="fa-solid fa-file-image"></i> ${d.gifBtn}</button>
                            </div>

                            <div class="playground-card">
                                <div>
                                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-video text-purple-400"></i>${d.videoCard}</h3>
                                    <div class="file-upload-wrapper" style="padding: 16px 12px; margin-bottom: 12px;">
                                        <input type="file" id="pg_video" accept="video/*" onchange="updateFileName(this, 'vid_name')">
                                        <i class="fa-solid fa-cloud-arrow-up file-upload-icon" style="font-size: 24px; margin-bottom: 6px;"></i>
                                        <span class="file-upload-text" style="font-size: 12px;">${d.uploadVideo}</span>
                                        <div id="vid_name" class="file-selected-name"></div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 mb-3">
                                        <div>
                                            <label class="text-[11px] font-semibold text-[--text-muted]">${d.sampleRate}</label>
                                            <input type="number" id="pg_sample_rate" value="0.1" step="0.05" min="0.01" max="1" class="playground-input !py-1.5 !px-3 text-xs">
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-semibold text-[--text-muted]">${d.maxFrames}</label>
                                            <input type="number" id="pg_max_frames" value="100" step="10" min="10" max="500" class="playground-input !py-1.5 !px-3 text-xs">
                                        </div>
                                    </div>
                                </div>
                                <button class="btn-primary w-full" onclick="pgSendVideo()"><i class="fa-solid fa-video"></i> ${d.videoBtn}</button>
                            </div>

                            <div class="playground-card">
                                <div>
                                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-link text-purple-400"></i>${d.urlCard}</h3>
                                    <div class="mb-4">
                                        <label class="text-xs font-semibold text-[--text-muted] mb-1.5 block">${d.url}</label>
                                        <input type="url" id="pg_url_input" class="playground-input" placeholder="${d.placeholder}" dir="ltr">
                                    </div>
                                </div>
                                <button class="btn-primary w-full" onclick="pgSendUrl()"><i class="fa-solid fa-link"></i> ${d.urlBtn}</button>
                            </div>
                        </div>

                        <!-- Playground Response Area -->
                        <div class="card">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-terminal text-purple-400"></i>${d.responseTitle}</h3>
                                <div class="flex items-center gap-2">
                                    <div id="pg_status_badge" class="pg-status pg-status-load" style="display:none;"></div>
                                    <button class="btn-outline text-xs !py-1.5 !px-3" onclick="pgClearResponse()"><i class="fa-solid fa-rotate-right"></i> ${d.clearBtn}</button>
                                </div>
                            </div>
                            <div class="vscode-window">
                                <div class="vscode-header">
                                    <div class="vscode-dots"><div class="vscode-dot dot-red"></div><div class="vscode-dot dot-yellow"></div><div class="vscode-dot dot-green"></div></div>
                                    <div class="text-[11px] font-mono text-gray-400">playground_response.json</div>
                                </div>
                                <div style="position:relative">
                                    <button class="copy-btn" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> ${currentLang==='fa'?'کپی':'Copy'}</button>
                                    <pre class="response-pre" id="pg_response_output"><code>${d.noResponse}</code></pre>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }
        };

        // ============ PLAYGROUND LOGIC ============
        function updateFileName(input, elId) {
            const el = document.getElementById(elId);
            if (input.files && input.files[0]) {
                el.textContent = input.files[0].name;
            } else {
                el.textContent = '';
            }
        }

        function pgClearResponse() {
            const d = t[currentLang].playground;
            document.getElementById('pg_response_output').textContent = d.noResponse;
            const badge = document.getElementById('pg_status_badge');
            badge.style.display = 'none';
        }

        function pgShowLoading() {
            const d = t[currentLang].playground;
            document.getElementById('pg_response_output').textContent = d.loading;
            const badge = document.getElementById('pg_status_badge');
            badge.style.display = 'inline-flex';
            badge.className = 'pg-status pg-status-load';
            badge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + d.loading;
        }

        function pgShowResult(data, status, ok) {
            document.getElementById('pg_response_output').textContent = JSON.stringify(data, null, 2);
            const badge = document.getElementById('pg_status_badge');
            badge.style.display = 'inline-flex';
            badge.className = ok ? 'pg-status pg-status-ok' : 'pg-status pg-status-err';
            badge.innerHTML = `<i class="fa-solid fa-${ok ? 'check' : 'triangle-exclamation'}"></i> HTTP ${status}`;
            try { Prism.highlightAll(); } catch (e) {}
        }

        async function pgSendImage() {
            const fileInput = document.getElementById('pg_image');
            if (!fileInput.files || !fileInput.files[0]) {
                alert(currentLang === 'fa' ? 'لطفاً یک تصویر انتخاب کنید.' : 'Please select an image file.');
                return;
            }
            pgShowLoading();
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            setTimeout(() => {
                const mockResponse = {
                    Moxra: {
                        model: "Moxra-1",
                        ok: true,
                        channel: "moxra.ir",
                        writer: " @Moxra ",
                        result: {
                            filename: fileInput.files[0].name,
                            type: "image",
                            predictions: { neutral: 0.89, sexy: 0.06, porn: 0.02, hentai: 0.02, drawing: 0.01 },
                            nsfw_score: 0.10,
                            is_nsfw: false,
                            is_safe: true,
                            is_suspicious: false
                        }
                    }
                };
                pgShowResult(mockResponse, 200, true);
            }, 800);
        }

        async function pgSendGif() {
            const fileInput = document.getElementById('pg_gif');
            if (!fileInput.files || !fileInput.files[0]) {
                alert(currentLang === 'fa' ? 'لطفاً یک گیف انتخاب کنید.' : 'Please select a GIF file.');
                return;
            }
            pgShowLoading();
            setTimeout(() => {
                const mockResponse = {
                    Moxra: {
                        model: "Moxra-1",
                        ok: true,
                        channel: "moxra.ir",
                        writer: " @Moxra ",
                        result: {
                            filename: fileInput.files[0].name,
                            type: "gif",
                            predictions: { neutral: 0.82, sexy: 0.10, porn: 0.04, hentai: 0.03, drawing: 0.01 },
                            nsfw_score: 0.17,
                            is_nsfw: false,
                            is_safe: true,
                            is_suspicious: false
                        }
                    }
                };
                pgShowResult(mockResponse, 200, true);
            }, 900);
        }

        async function pgSendVideo() {
            const fileInput = document.getElementById('pg_video');
            if (!fileInput.files || !fileInput.files[0]) {
                alert(currentLang === 'fa' ? 'لطفاً یک ویدیو انتخاب کنید.' : 'Please select a video file.');
                return;
            }
            pgShowLoading();
            setTimeout(() => {
                const mockResponse = {
                    Moxra: {
                        model: "Moxra-1",
                        ok: true,
                        channel: "moxra.ir",
                        writer: " @Moxra ",
                        result: {
                            filename: fileInput.files[0].name,
                            type: "video",
                            predictions: { neutral: 0.91, sexy: 0.04, porn: 0.02, hentai: 0.02, drawing: 0.01 },
                            nsfw_score: 0.08,
                            is_nsfw: false,
                            is_safe: true,
                            is_suspicious: false,
                            frames: [{ time: 0.1, predictions: { neutral: 0.9 } }],
                            metadata: { total_frames: 150, processed_frames: 15, fps: 30, duration: 5 }
                        }
                    }
                };
                pgShowResult(mockResponse, 200, true);
            }, 1200);
        }

        async function pgSendUrl() {
            const urlInput = document.getElementById('pg_url_input').value.trim();
            if (!urlInput) {
                alert(currentLang === 'fa' ? 'لطفاً لینک فایل را وارد کنید.' : 'Please enter a valid file URL.');
                return;
            }
            pgShowLoading();
            setTimeout(() => {
                const mockResponse = {
                    Moxra: {
                        model: "Moxra-1",
                        ok: true,
                        channel: "moxra.ir",
                        writer: " @Moxra ",
                        result: {
                            filename: urlInput.split('/').pop() || 'file.jpg',
                            type: "image",
                            predictions: { neutral: 0.88, sexy: 0.07, porn: 0.02, hentai: 0.02, drawing: 0.01 },
                            nsfw_score: 0.11,
                            is_nsfw: false,
                            is_safe: true,
                            is_suspicious: false
                        }
                    }
                };
                pgShowResult(mockResponse, 200, true);
            }, 800);
        }

        // Initialize default view
        renderSidebar();
        navigate('playground');
    </script>
</body>
</html>
